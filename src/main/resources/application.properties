spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3333}/travelplanner
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# @JsonView가 붙은 필드는 컨트롤러가 명시적으로 뷰를 지정한 응답에서만 노출된다(기본은 비노출).
# 다른 사용자의 연락처/생년월일/주소 등이 플랜·댓글 응답에 실수로 섞여 나가는 것을 막기 위함.
spring.jackson.mapper.default-view-inclusion=false

# JWT secrets - override via environment variables in every real deployment.
# Generate with e.g. `openssl rand -base64 48`.
app.jwt.secret-access=${JWT_SECRET_ACCESS:CHANGE_ME_ACCESS_SECRET_CHANGE_ME}
app.jwt.secret-refresh=${JWT_SECRET_REFRESH:CHANGE_ME_REFRESH_SECRET_CHANGE_ME}
app.jwt.secret-reset=${JWT_SECRET_RESET:CHANGE_ME_RESET_SECRET_CHANGE_ME}

# CORS: comma-separated list of allowed origins (no wildcard in production).
# 5174는 Claude 브라우저 프리뷰 도구 전용 포트(.claude/launch.json), 3000은 npm start 기본 포트.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

# Local file storage for uploaded profile images.
app.upload.dir=${UPLOAD_DIR:./uploads/imgs}

# Kakao OAuth. client-secret must be overridden via env var in every real deployment
# (it used to be hardcoded in the frontend bundle, which leaked it publicly).
app.kakao.client-id=${KAKAO_CLIENT_ID:0a61f9efbdac3933e6a14ed6f553bd00}
app.kakao.client-secret=${KAKAO_CLIENT_SECRET:K2uqygqk3ddG8UFgrIFdE76bKg9SpEwT}
app.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:3000/login}

# Outgoing mail (used for password-reset codes). Requires a real SMTP account.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
